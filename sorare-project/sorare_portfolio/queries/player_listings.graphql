# Live listings for one player, used for floor prices.
# Speculative shape: if the doctor marks this query FAILED, floors fall back to
# a capped sweep of the global live-listings feed instead (see ingest/floors.py).
query PlayerListings($playerSlug: String!) {
  player(slug: $playerSlug) {
    slug
    liveSingleSaleOffers {
      nodes {
        id
        senderSide {
          amounts { wei eur }
          anyCards { slug rarityTyped seasonYear serialNumber }
        }
      }
    }
  }
}

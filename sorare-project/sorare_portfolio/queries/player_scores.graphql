# Player form. so5Scores is the per-match list, which is where L5, L10, L40 and
# the starter share are derived from - one source, so the three averages can
# never disagree with each other.
#
# `players` returns the cross-sport interface, so the football-only scoring
# fields need an inline fragment on Player.
query PlayerScores($slugs: [String!]!) {
  players(slugs: $slugs) {
    slug
    displayName
    ... on Player {
      so5Scores(last: 40) {
        score
        game { date }
        playerGameStats { minsPlayed gameStarted onGameSheet }
      }
    }
  }
}

# Your gallery, page by page. `cards` replaced `paginatedCards`, which Sorare
# removed. Fiat amounts are in cents (MonetaryAmount.eurCents).
#
# Lines tagged "# @opt <Type>.<field>" are dropped automatically when the schema
# doctor says the field is not available, so a peripheral change at Sorare
# cannot stop the core pull.
query Gallery($cursor: String) {
  currentUser {
    cards(after: $cursor) {
      nodes {
        slug
        assetId
        rarityTyped
        seasonYear
        serialNumber
        anyPositions
        xp
        grade
        inSeasonEligible
        ownerSince                                     # @opt Card.ownerSince
        publicMinPrices { eurCents }                   # @opt Card.publicMinPrices
        anyPlayer {
          slug
          displayName
          age
          activeClub { slug name domesticLeague { displayName } }
        }
        anyTeam { name }
        tokenOwner {
          from
          transferType
          amounts { wei eurCents }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}

# Direct offers and buy offers you sent that ended. Only accepted ones are
# transactions; the rest are noise. Card-for-card legs carry no cash.
query MyEndedOffersSent($cursor: String) {
  currentUser {
    endedTokenOffersSent(after: $cursor) {
      nodes {
        id
        type
        status
        acceptedAt
        endDate
        senderSide {
          amounts { wei eurCents }
          anyCards {
            slug rarityTyped seasonYear serialNumber inSeasonEligible
            anyPlayer { slug displayName }
          }
        }
        receiverSide {
          amounts { wei eurCents }
          anyCards {
            slug rarityTyped seasonYear serialNumber inSeasonEligible
            anyPlayer { slug displayName }
          }
        }
        userBuyer { slug nickname }
        userSeller { slug nickname }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

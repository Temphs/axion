# Cards you bought from another manager's listing -> BUY / MANAGER_SALE.
query MyBoughtSingleSaleOffers($cursor: String) {
  currentUser {
    boughtSingleSaleTokenOffers(after: $cursor) {
      nodes {
        id
        type
        status
        acceptedAt
        endDate
        senderSide {
          amounts { wei eurCents }
          anyCards {
            slug rarityTyped seasonYear serialNumber inSeasonEligible
            anyPlayer { slug displayName }
          }
        }
        userSeller { slug nickname }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

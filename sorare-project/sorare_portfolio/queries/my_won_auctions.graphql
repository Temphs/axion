# Auctions you won -> BUY / AUCTION transactions.
query MyWonAuctions($cursor: String) {
  currentUser {
    wonTokenAuctions(after: $cursor) {
      nodes {
        id
        endDate
        currentPrice
        bestBid { amounts { wei eurCents } }
        anyCards {
          slug
          rarityTyped
          seasonYear
          serialNumber
          inSeasonEligible
          anyPlayer { slug displayName }
        }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

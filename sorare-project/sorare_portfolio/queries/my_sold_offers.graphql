# Your own listings that sold -> SELL / MANAGER_SALE.
query MySoldSingleSaleOffers($cursor: String) {
  currentUser {
    soldSingleSaleTokenOffers(after: $cursor) {
      nodes {
        id
        type
        status
        acceptedAt
        endDate
        senderSide {
          amounts { wei eurCents }
          anyCards {
            slug rarityTyped seasonYear serialNumber inSeasonEligible
            anyPlayer { slug displayName }
          }
        }
        userBuyer { slug nickname }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

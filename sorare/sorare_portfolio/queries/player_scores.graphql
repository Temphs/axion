# Player form. Sorare does not document these fields, so every one of them is
# optional: whatever your schema actually has survives the doctor, the rest is
# dropped and the L5/L10/L40 columns simply stay blank.
#
# Run `update_sorare.bat doctor` and read the "scores" line of the discovery
# report - it lists the real score-related field names in your schema, which is
# what to put here if these guesses do not match.
query PlayerScores($slug: String!) {
  player(slug: $slug) {
    slug
    lastFiveSo5AverageScore                            # @opt Player.lastFiveSo5AverageScore
    lastFifteenSo5AverageScore                         # @opt Player.lastFifteenSo5AverageScore
    lastFifteenSo5Appearances                          # @opt Player.lastFifteenSo5Appearances
  }
}
